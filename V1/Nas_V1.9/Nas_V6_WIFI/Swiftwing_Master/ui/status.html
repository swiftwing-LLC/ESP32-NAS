
<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" id="themeColorMeta" content="#060b17"><title>Swiftwing NAS · System Status</title>
<script>try{if(localStorage.getItem('swiftwing-theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<style>
/* Inline source: see status.css */
</style>
</head>
<body>
<div class="top liquidNav glassSurface"><div class="brand">SWIFTWING / INFRASTRUCTURE</div><div class="nav"><a href="/">Files</a><a class="active" href="/status">System Status</a><a href="/logout">Logout</a><button id="themeToggle" class="themeSwitch glassSurface" type="button" aria-pressed="false" onclick="toggleTheme()"><span class="themeGlyph" aria-hidden="true">◐</span><span class="themeLabel">Light mode</span></button></div></div>
<div class="page"><div class="eyebrow">Network / Node Telemetry</div><div class="title">System Status</div><div class="sub">Live state from the Master, storage nodes and network services.</div><div id="cards" class="grid"></div><div class="backnote"><b>Storage policy:</b> Node 1 is the primary volume used by Files. Node 2 remains available for backup and background services.</div></div>
<script>
function fmtBytes(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}
function fmtUptime(sec){sec=Number(sec||0);const d=Math.floor(sec/86400);sec%=86400;const h=Math.floor(sec/3600);sec%=3600;const m=Math.floor(sec/60);if(d>0)return d+'d '+h+'h';if(h>0)return h+'h '+m+'m';return m+'m'}
function statusLabel(on){return'<span class="dot '+(on?'on':'off')+'"></span>'+(on?'Online':'Offline')}
function storageCard(n,title,role){const total=Number(n.total||0),used=Number(n.used||0),pct=total>0?Math.min(100,used/total*100):0;return'<div class="card"><div class="row"><div><div class="name">'+title+'</div><div class="role">'+role+'</div></div><div class="state">'+statusLabel(n.online)+'</div></div><div class="data"><div class="key">Device</div><div>'+n.id+'</div><div class="key">IP</div><div>'+(n.online?n.ip:'—')+'</div><div class="key">Storage</div><div>'+(n.storageReady?'Ready':'Not ready')+'</div><div class="key">Used</div><div>'+fmtBytes(n.used)+'</div><div class="key">Free</div><div>'+fmtBytes(n.free)+'</div><div class="key">Uptime</div><div>'+fmtUptime(n.uptime)+'</div></div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div></div>'}
function serviceCard(s,title,role,extra){return'<div class="card"><div class="row"><div><div class="name">'+title+'</div><div class="role">'+role+'</div></div><div class="state">'+statusLabel(s.online)+'</div></div><div class="data"><div class="key">IP</div><div>'+(s.online?s.ip:'—')+'</div>'+(s.uptime!==undefined?'<div class="key">Uptime</div><div>'+fmtUptime(s.uptime)+'</div>':'')+(extra||'')+'</div></div>'}
let fanInteractionActive=false,fanDraftPercent=null,fanDraftDirty=false,fanPendingPercent=null,fanPendingAt=0,fanMessageText='',fanMessageState='';
window.addEventListener('pointerup',()=>fanInteractionActive=false);
window.addEventListener('pointercancel',()=>fanInteractionActive=false);
function fanPanel(s,isAdmin){
  const available=!!(s.online&&s.fanSupported);
  let value=fanPendingPercent!==null?fanPendingPercent:(fanDraftDirty?fanDraftPercent:Number(s.fanPercent||0));
  value=Math.max(0,Math.min(100,Number(value||0)));
  const disabled=!available||!isAdmin;
  const reason=!s.online?'Monitor offline':!s.fanSupported?'Flash the fan-enabled ESP32 Monitor firmware':!isAdmin?'Owner account required to change speed':'';
  const output=Number(s.fanOutputPercent||0);
  const feedback=available&&Number(s.fanPercent)>0&&output>Number(s.fanPercent)?' · startup assist '+output+'%':'';
  return '<div class="fanPanel"><div class="fanHeading"><div><div class="fanTitle">Cooling fan</div><div class="fanRole">PWM output · GPIO25 · 25 kHz</div></div><output id="fanReadout" for="fanPercent" aria-live="polite">'+value+'%</output></div>'+
    '<label class="srOnly" for="fanPercent">Fan output percentage</label><input id="fanPercent" class="fanRange" type="range" min="0" max="100" step="5" value="'+value+'"'+(disabled?' disabled':'')+' onpointerdown="fanInteractionActive=true" onkeydown="fanInteractionActive=true" onkeyup="fanInteractionActive=false" oninput="previewFan(this.value)">' +
    '<div class="fanScale"><span>OFF</span><span>100%</span></div><div class="fanActions"><button class="fanApply" type="button" onclick="applyFanSpeed()"'+(disabled?' disabled':'')+'>Apply speed</button><button class="fanOff" type="button" onclick="stopFan()"'+(disabled?' disabled':'')+'>Off</button><span id="fanMessage" class="fanMessage '+fanMessageState+'">'+escapeFanText(fanMessageText)+'</span></div>'+
    '<div class="fanHint">'+(reason||('Setpoint '+Number(s.fanPercent||0)+'% · output '+output+'%'+feedback+' · RPM sensor not installed'))+'</div></div>';
}
function previewFan(value){fanDraftPercent=Number(value);fanDraftDirty=true;const readout=document.getElementById('fanReadout');if(readout)readout.value=fanDraftPercent+'%';}
function escapeFanText(value){return String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function setFanMessage(text,state){fanMessageText=text;fanMessageState=state||'';const message=document.getElementById('fanMessage');if(message){message.textContent=text;message.className='fanMessage '+fanMessageState}}
async function applyFanSpeed(){const input=document.getElementById('fanPercent');if(!input)return;const percent=Math.max(0,Math.min(100,Number(input.value)||0));setFanMessage('Sending command…','pending');try{const r=await fetch('/api/fan',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'percent='+encodeURIComponent(percent)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Fan command failed');fanPendingPercent=Number(d.requested);fanPendingAt=Date.now();fanDraftDirty=false;fanDraftPercent=null;setFanMessage('Command sent · waiting for monitor','pending')}catch(e){setFanMessage(e.message,'error')}}
function stopFan(){const input=document.getElementById('fanPercent');if(!input)return;input.value='0';previewFan('0');applyFanSpeed()}
async function refreshStatus(){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.status===401){location.href='/';return}const s=await r.json();const monitor=s.services.monitor;if(fanPendingPercent!==null&&monitor.fanSupported&&Number(monitor.fanPercent)===fanPendingPercent){fanPendingPercent=null;setFanMessage('Speed confirmed by monitor','success')}else if(fanPendingPercent!==null&&Date.now()-fanPendingAt>15000){fanPendingPercent=null;setFanMessage('No confirmation received yet','error')}if(fanInteractionActive)return;let html='';html+=serviceCard(s.services.master,'Master','Control / UI','');html+=storageCard(s.nodes.NODE1,'Primary Storage','Main NAS data');html+=storageCard(s.nodes.NODE2,'Backup Node','Reserved for backup / background tasks');html+=serviceCard(s.services.dns,'C3 DNS','Local DNS service','');html+=serviceCard(monitor,'ESP32 Monitor','Monitor / OLED','<div class="key">Wi-Fi RSSI</div><div>'+monitor.rssi+' dBm</div>'+fanPanel(monitor,s.isAdmin));document.getElementById('cards').innerHTML=html}catch(e){if(!fanInteractionActive)document.getElementById('cards').innerHTML='<div class="card">Unable to load system status.</div>'}}
refreshStatus();setInterval(refreshStatus,3000);
</script>
<script>
function applyTheme(theme,persist){const selected=theme==='light'?'light':'dark';document.documentElement.dataset.theme=selected;const light=selected==='light';document.querySelectorAll('.themeSwitch').forEach(button=>{button.setAttribute('aria-pressed',String(light));button.setAttribute('aria-label',light?'Switch to dark theme':'Switch to light theme');button.innerHTML=light?'<span class="themeGlyph" aria-hidden="true">◑</span><span class="themeLabel">Dark mode</span>':'<span class="themeGlyph" aria-hidden="true">◐</span><span class="themeLabel">Light mode</span>'});const meta=document.getElementById('themeColorMeta');if(meta)meta.content=light?'#edf2f8':'#060b17';if(persist){try{localStorage.setItem('swiftwing-theme',selected)}catch(e){}}}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light',true)}
window.addEventListener('storage',event=>{if(event.key==='swiftwing-theme')applyTheme(event.newValue,false)});
applyTheme(document.documentElement.dataset.theme||'dark',false);
function setupGlassInteractions(){if(!window.matchMedia('(hover: hover) and (pointer: fine)').matches||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;let active=null,frame=0,x=0,y=0;document.addEventListener('pointermove',event=>{const surface=event.target.closest&&event.target.closest('.glassSurface');if(!surface){if(active){active.style.removeProperty('--glass-x');active.style.removeProperty('--glass-y');active=null}return}active=surface;x=event.clientX;y=event.clientY;if(!frame)frame=requestAnimationFrame(()=>{frame=0;if(!active||!active.isConnected)return;const rect=active.getBoundingClientRect();active.style.setProperty('--glass-x',Math.max(0,Math.min(100,(x-rect.left)/rect.width*100))+'%');active.style.setProperty('--glass-y',Math.max(0,Math.min(100,(y-rect.top)/rect.height*100))+'%')})},{passive:true});document.addEventListener('pointerout',event=>{const surface=event.target.closest&&event.target.closest('.glassSurface');if(surface&&!surface.contains(event.relatedTarget)){surface.style.removeProperty('--glass-x');surface.style.removeProperty('--glass-y');if(active===surface)active=null}},true)}
setupGlassInteractions();
function setupLiquidNav(){const nav=document.querySelector('.liquidNav');if(!nav)return;let last=window.scrollY,frame=0;if(last>24)nav.classList.add('glassCompact');window.addEventListener('scroll',()=>{if(frame)return;frame=requestAnimationFrame(()=>{frame=0;const current=window.scrollY;if(current<18||current<last-3)nav.classList.remove('glassCompact');else if(current>28&&current>last+3)nav.classList.add('glassCompact');last=current})},{passive:true})}
setupLiquidNav();
</script>
</body>
</html>
